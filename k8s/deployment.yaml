apiVersion: apps/v1
kind: Deployment
metadata:
  name: book1-frontend
  namespace: default
  labels:
    app: book1-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: book1-frontend
  template:
    metadata:
      labels:
        app: book1-frontend
    spec:
      containers:
        - name: book1-frontend
          image: docker.io/franciscoguardado100/book1-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: DRUPAL_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: book1-frontend-config
                  key: DRUPAL_BASE_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
